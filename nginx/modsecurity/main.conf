Include /etc/modsecurity/modsecurity.conf
Include /etc/modsecurity/engine.conf

# Match the existing edge's 20 MiB body limit; inspect requests only.
SecRequestBodyLimit 20971520
SecRequestBodyNoFilesLimit 20971520
SecResponseBodyAccess Off
SecTmpDir /var/cache/modsecurity
SecDataDir /var/cache/modsecurity
SecUnicodeMapFile /etc/modsecurity/unicode.mapping 20127
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# Omit header/body sections. Matched values may still appear in rule messages.
SecAuditLogFormat JSON
SecAuditLogParts AHZ
SecAuditLog /var/log/nginx/modsecurity-audit.log

SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
    "id:10000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

Include /opt/owasp-crs/crs-setup.conf
SecAction "id:10001,phase:1,pass,nolog,t:none,setvar:tx.blocking_paranoia_level=1,setvar:tx.detection_paranoia_level=1,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
Include /etc/modsecurity/exclusions-before.conf
Include /opt/owasp-crs/rules/*.conf
Include /etc/modsecurity/exclusions-after.conf
